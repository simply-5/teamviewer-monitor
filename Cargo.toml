[package]
name = "teamviewer-monitor"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
jiff = { version = "0.2.37", features = ["serde"] }
listenfd = "1.0.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
stilts = "0.3.3"
tokio = { version = "1.53.1", features = ["rt", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
